<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>互动小屋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./chat-styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <section class="intro-card">
        <div class="intro-copy">
          <p class="eyebrow">Private Space</p>
          <h1>互动小屋</h1>
          <p class="intro-text">
            这是你们共享的小空间，可以聊天、回答随机问题、玩猜谜，也可以轮流玩我画你猜。两个人打开同一个链接，就能看到同一份云端内容。
          </p>
        </div>

        <div class="intro-meta">
          <div class="mode-card">
            <span>当前模式</span>
            <strong id="modeBadge">检测中</strong>
            <small id="modeHint">正在检查云端连接</small>
          </div>
          <div class="intro-actions">
            <a class="soft-button" href="./index.html">返回相册</a>
            <button id="refreshAllButton" class="soft-button ghost" type="button">刷新云端</button>
            <button id="clearLocalCacheButton" class="soft-button ghost" type="button">清空本机缓存</button>
          </div>
        </div>
      </section>

      <section class="chat-layout">
        <aside class="side-panel">
          <article class="panel-card compact">
            <p class="panel-kicker">Today</p>
            <h2>今日心情卡</h2>
            <form id="moodForm" class="stack-form">
              <label>
                今天是谁
                <input id="moodAuthorInput" type="text" maxlength="20" placeholder="比如：我 / 宝宝" required />
              </label>
              <label>
                此刻心情
                <select id="moodSelect">
                  <option value="想你">想你</option>
                  <option value="开心">开心</option>
                  <option value="困困">困困</option>
                  <option value="想抱抱">想抱抱</option>
                  <option value="想约会">想约会</option>
                </select>
              </label>
              <label>
                一句话
                <textarea id="moodNoteInput" rows="3" maxlength="80" placeholder="写一句现在最想说的话"></textarea>
              </label>
              <button type="submit">保存心情</button>
            </form>
            <div id="moodCard" class="mood-card"></div>
          </article>

          <article class="panel-card compact">
            <div class="inline-head">
              <div>
                <p class="panel-kicker">Mini Game</p>
                <h2>猜谜小卡</h2>
              </div>
              <span id="riddleCountBadge" class="badge">0</span>
            </div>

            <form id="riddleForm" class="stack-form">
              <label>
                出题人
                <input id="riddleAuthorInput" type="text" maxlength="20" placeholder="比如：宝宝" required />
              </label>
              <label>
                谜题
                <textarea id="riddleQuestionInput" rows="3" maxlength="120" placeholder="写一个有趣的小谜题" required></textarea>
              </label>
              <label>
                答案
                <input id="riddleAnswerInput" type="text" maxlength="40" placeholder="把答案先藏起来" required />
              </label>
              <button type="submit">发布谜题</button>
            </form>
            <div id="riddleList" class="riddle-list"></div>
          </article>

          <article class="panel-card compact">
            <div class="inline-head">
              <div>
                <p class="panel-kicker">Random Prompt</p>
                <h2>随机问题卡</h2>
              </div>
              <button id="nextPromptButton" class="tiny-button" type="button">换一题</button>
            </div>

            <div class="prompt-card">
              <strong id="promptQuestionText">还没有问题</strong>
              <p id="promptHintText">点一下按钮，生成一题属于你们这轮的共享问题。</p>
            </div>

            <form id="promptAnswerForm" class="stack-form">
              <label>
                谁来回答
                <input id="promptAuthorInput" type="text" maxlength="20" placeholder="你的名字" required />
              </label>
              <label>
                你的回答
                <textarea id="promptAnswerInput" rows="3" maxlength="200" placeholder="认真一点也可以，撒娇一点也可以" required></textarea>
              </label>
              <button type="submit">保存回答</button>
            </form>

            <div id="promptAnswers" class="answer-list"></div>
          </article>
        </aside>

        <section class="main-panel">
          <article class="panel-card chat-card">
            <div class="panel-head">
              <div>
                <p class="panel-kicker">Chat</p>
                <h2>聊天区</h2>
              </div>
              <span id="messageCountBadge" class="badge">0</span>
            </div>

            <div id="chatStream" class="chat-stream" aria-live="polite"></div>

            <form id="chatForm" class="chat-form">
              <input id="chatAuthorInput" type="text" maxlength="20" placeholder="谁发的" required />
              <textarea id="chatTextInput" rows="2" maxlength="200" placeholder="发一句悄悄话..." required></textarea>
              <button type="submit">发送</button>
            </form>
          </article>

          <article class="panel-card draw-card">
            <div class="panel-head">
              <div>
                <p class="panel-kicker">Draw & Guess</p>
                <h2>我画你猜</h2>
              </div>
              <span id="drawRoundBadge" class="badge">第 0 轮</span>
            </div>

            <form id="drawRoundForm" class="draw-round-form">
              <input id="drawRoundAuthorInput" type="text" maxlength="20" placeholder="这一轮谁来画" required />
              <input id="drawRoundPromptInput" type="text" maxlength="30" placeholder="词语或成语" required />
              <button id="randomDrawPromptButton" class="soft-button ghost" type="button">随机题目</button>
              <button type="submit">开始下一轮</button>
            </form>

            <div class="draw-round-meta">
              <div>
                <span>当前画手</span>
                <strong id="drawRoundAuthorText">还没有开始</strong>
              </div>
              <div>
                <span>本轮题目</span>
                <strong id="drawRoundPromptText">先创建第一轮</strong>
                <button id="toggleDrawPromptButton" class="tiny-button ghost" type="button">显示 / 隐藏</button>
              </div>
            </div>

            <div class="draw-tools">
              <input id="brushColorInput" type="color" value="#ff6b81" aria-label="Brush color" />
              <input id="brushSizeInput" type="range" min="2" max="18" value="6" aria-label="Brush size" />
              <button id="clearCanvasButton" class="soft-button ghost" type="button">清空画板</button>
              <button id="saveCanvasButton" class="soft-button" type="button">上传画作</button>
            </div>

            <canvas id="drawCanvas" width="960" height="420"></canvas>
            <p class="draw-hint">
              画作会压缩后直接存进数据库，不走图片存储桶，所以会比传照片省很多空间。
            </p>

            <form id="drawGuessForm" class="stack-form draw-guess-form">
              <label>
                谁来猜
                <input id="drawGuessAuthorInput" type="text" maxlength="20" placeholder="比如：宝宝" required />
              </label>
              <label>
                你的猜测
                <input id="drawGuessInput" type="text" maxlength="40" placeholder="写下你的答案" required />
              </label>
              <button type="submit">提交猜测</button>
            </form>

            <div id="drawGuessCard" class="guess-card"></div>
          </article>
        </section>
      </section>
    </main>

    <template id="emptyChatTemplate">
      <div class="empty-box">
        <strong>还没有消息</strong>
        <p>先发第一句“在吗，我想你了”。</p>
      </div>
    </template>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./config.example.js"></script>
    <script src="./chat-app.js"></script>
  </body>
</html>
