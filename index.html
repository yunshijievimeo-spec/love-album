<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>号号和秀琴的小天地</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="lockScreen" class="lock-screen">
        <div class="lock-photo" aria-hidden="true">
          <div id="lockPhotoHearts" class="lock-photo-hearts"></div>
          <div class="polaroid p1">
            <span></span>
            <small>一起出发</small>
          </div>
          <div class="polaroid p2">
            <span></span>
            <small>慢慢收藏</small>
          </div>
        </div>

        <div class="lock-panel">
          <p class="eyebrow">Private Album</p>
          <h1>号号和秀琴的小天地</h1>
          <p class="intro">把出去玩的照片、当天的小心情和想说的话，都轻轻放在这里。</p>
          <form id="loginForm" class="password-form">
            <label for="sitePassword">共同密码</label>
            <div class="password-row">
              <div id="passwordHearts" class="password-hearts" aria-hidden="true"></div>
              <input id="sitePassword" type="password" autocomplete="current-password" placeholder="输入你们的共同密码" />
              <button type="submit">进入</button>
            </div>
            <p id="loginError" class="form-error" role="alert"></p>
          </form>
        </div>
      </section>

      <section id="albumApp" class="album-app" hidden>
        <section class="love-counter" aria-label="相识纪念日">
          <div class="counter-header">号号和秀琴相伴的</div>
          <div class="counter-body">
            <div id="counterHearts" class="counter-hearts" aria-hidden="true"></div>
            <div id="counterBigHeart" class="counter-big-heart" aria-hidden="true">❤</div>
            <div class="counter-number">
              <strong id="daysTogether">1</strong>
              <span>天</span>
            </div>
            <div class="counter-live">
              <span><strong id="hoursTogether">0</strong> 小时</span>
              <span><strong id="minutesTogether">0</strong> 分钟</span>
              <span><strong id="secondsTogether">0</strong> 秒</span>
            </div>
          </div>
          <div class="counter-footer">
            <span>起始日：</span>
            <time id="metDateText" datetime="2026-01-01">2026-01-01</time>
          </div>
          <div class="counter-checkin">
            <label class="checkin-identity" for="checkinIdentitySelect">
              今天是
              <select id="checkinIdentitySelect">
                <option value="号号">号号</option>
                <option value="秀琴">秀琴</option>
              </select>
            </label>
            <button id="dailyCheckinButton" class="daily-checkin-button" type="button">美好的一天</button>
            <p id="dailyCheckinStatus" class="daily-checkin-status" role="status"></p>
          </div>
        </section>

        <header class="hero">
          <div>
            <p class="eyebrow">Love Journal</p>
            <h1>号号和秀琴的小天地</h1>
            <p>一张照片，一段文字，慢慢攒成你们自己的小宇宙。</p>
          </div>
          <div class="hero-actions">
            <a class="ghost-button hero-link-button" href="./chat.html">进入互动小屋</a>
            <button id="logoutButton" class="ghost-button" type="button">锁定</button>
          </div>
        </header>

        <section class="composer" aria-label="新增旅行记录">
          <form id="memoryForm">
            <input id="editingIdInput" type="hidden" />
            <div class="upload-box">
              <input id="photoInput" name="photo" type="file" accept="image/*" required />
              <label for="photoInput">
                <span class="upload-icon">+</span>
                <strong id="uploadTitle">上传一张照片</strong>
                <small id="uploadHint">手机拍的照片也可以直接上传</small>
              </label>
              <img id="previewImage" alt="" hidden />
            </div>

            <div class="form-grid">
              <label>
                标题
                <input id="titleInput" name="title" type="text" maxlength="40" placeholder="比如：海边的傍晚" required />
              </label>
              <label>
                日期
                <input id="dateInput" name="memory_date" type="date" required />
              </label>
              <label>
                地点
                <input id="locationInput" name="location" type="text" maxlength="40" placeholder="去了哪里" />
              </label>
              <label class="wide">
                文字记录
                <textarea id="noteInput" name="note" rows="4" maxlength="240" placeholder="今天发生了什么，想对对方说什么..." required></textarea>
              </label>
            </div>

            <div class="form-actions">
              <p id="saveStatus" role="status"></p>
              <div class="action-buttons">
                <button id="cancelEditButton" class="ghost-button" type="button" hidden>取消修改</button>
                <button id="submitMemoryButton" type="submit">保存这一刻</button>
              </div>
            </div>
          </form>
        </section>

        <section class="message-board" aria-label="留言条">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Love Notes</p>
              <h2>留言条</h2>
              <p>记录一句今天想说的话，也可以记下一个小小的误会和和好。</p>
            </div>
          </div>

          <form id="messageForm" class="message-form">
            <input id="editingMessageIdInput" type="hidden" />
            <label>
              谁写的
              <input id="messageAuthorInput" type="text" maxlength="20" placeholder="比如：浩浩 / 秀琴" required />
            </label>
            <label>
              日期
              <input id="messageDateInput" type="date" required />
            </label>
            <label class="wide">
              留言内容
              <textarea
                id="messageTextInput"
                rows="3"
                maxlength="160"
                placeholder="比如：今天我晚回了你一个小时消息，对不起。"
                required
              ></textarea>
            </label>
            <div class="message-form-actions">
              <p id="messageStatus" role="status"></p>
              <div class="message-action-buttons">
                <button id="cancelMessageEditButton" class="ghost-button" type="button" hidden>取消修改</button>
                <button id="submitMessageButton" type="submit">写下这条留言</button>
              </div>
            </div>
          </form>

          <div class="message-table-wrap">
            <table class="message-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>谁写的</th>
                  <th>留言内容</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="messageTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="storage-panel" aria-label="存储空间">
          <div>
            <span>云端照片空间</span>
            <strong id="storageUsed">已用约 0 MB</strong>
          </div>
          <div class="storage-meter" aria-hidden="true">
            <span id="storageMeter"></span>
          </div>
          <p id="storageSummary">剩余约 1 GB，预计还能上传很多张照片。</p>
        </section>

        <section class="toolbar">
          <div>
            <span id="memoryCount">0</span>
            <small>条回忆</small>
          </div>
          <button id="refreshButton" class="ghost-button" type="button">刷新</button>
        </section>

        <section id="memoryGrid" class="memory-grid" aria-live="polite"></section>

        <template id="emptyTemplate">
          <article class="empty-state">
            <h2>还没有记录</h2>
            <p>先上传第一张照片吧。以后每次打开这里，都会多一点你们走过的路。</p>
          </article>
        </template>
      </section>
    </main>

    <div id="photoLightbox" class="photo-lightbox" hidden>
      <button id="lightboxClose" class="lightbox-close" type="button" aria-label="关闭大图">×</button>
      <img id="lightboxImage" alt="" />
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./config.example.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
